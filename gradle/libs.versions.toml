[versions]
kotlin = "2.4.20"
# Kotlin stdlib that EnderaLib loads at runtime; bump together with enderalib
kotlin-runtime = "2.4.20"
shadow = "9.6.1"
paperweight = "2.0.0-beta.24"
paper-api = "1.21.1-R0.1-SNAPSHOT"
packetevents = "2.14.0"
enderalib = "1.6.0"
interfaces = "2.2.0-folia-SNAPSHOT"
jetbrains-annotations = "26.1.0"
viaversion = "5.12.0"
vault = "1.7.1"
geyser = "2.11.3-SNAPSHOT"
floodgate = "2.2.5-SNAPSHOT"
authme = "5.7.0"
placeholderapi = "2.12.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
enderalib = { module = "com.github.Endera-Org:EnderaLib", version.ref = "enderalib" }
interfaces = { module = "com.noxcrew.interfaces:interfaces", version.ref = "interfaces" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
viaversion-api = { module = "com.viaversion:viaversion-api", version.ref = "viaversion" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }
geyser-api = { module = "org.geysermc.geyser:api", version.ref = "geyser" }
floodgate-api = { module = "org.geysermc.floodgate:api", version.ref = "floodgate" }
authme = { module = "fr.xephi:authme", version.ref = "authme" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
